appId: com.eduar.nitroscribe
productName: NitroScribe
copyright: Copyright (c) 2026 Eduard Georgescu. MIT License.
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - resources/**
asarUnpack:
  - resources/**
  # sherpa-onnx is a native addon (plus onnxruntime DLLs) and must live outside the asar archive.
  - '**/node_modules/sherpa-onnx-*/**'
npmRebuild: false
# Hardening: the installed NitroScribe.exe can't be used as a generic Node.js runtime or have code
# injected through environment variables / debugger flags, and app.asar is integrity-checked.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  resetAdHocDarwinSignature: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
# Apple Silicon only. The release workflow compiles whisper-server (Metal) into whisper-bin/mac first.
# Ad-hoc signed (no Apple Developer account), so macOS asks the user to approve it on first launch.
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  identity: '-'
  hardenedRuntime: false
  extraResources:
    - from: whisper-bin/mac
      to: whisper
  extendInfo:
    NSMicrophoneUsageDescription: NitroScribe transcribes your side of the call on this Mac.
    NSAudioCaptureUsageDescription: NitroScribe transcribes the other side of the call on this Mac.
dmg:
  artifactName: ${productName}-${version}-mac-arm64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NitroScribe
  artifactName: ${productName}-Setup-${version}.${ext}
