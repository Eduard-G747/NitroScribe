# Push a tag like v1.0.1 to build the Windows installer and attach it to a GitHub Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:ci
      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum NitroScribe-Setup-*.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" NitroScribe-Setup-*.exe SHA256SUMS.txt --title "NitroScribe $GITHUB_REF_NAME" --generate-notes
